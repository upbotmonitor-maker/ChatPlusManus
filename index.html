<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatPlus | Modern Sohbet Deneyimi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <!-- Giriş ve Kayıt Ekranı -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-comments logo-icon"></i>
                <h1>ChatPlus</h1>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Giriş Yap</h2>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="login-username" placeholder="Kullanıcı Adı" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Şifre" required>
                </div>
                <button type="submit" class="btn-primary">Giriş Yap</button>
                <p class="auth-footer">Hesabın yok mu? <a href="#" id="show-register">Kayıt Ol</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <h2>Kayıt Ol</h2>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="register-username" placeholder="Kullanıcı Adı" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="register-password" placeholder="Şifre" required>
                </div>
                <button type="submit" class="btn-primary">Kayıt Ol</button>
                <p class="auth-footer">Zaten üye misin? <a href="#" id="show-login">Giriş Yap</a></p>
            </form>
        </div>
    </div>

    <!-- Ana Uygulama Ekranı -->
    <div id="app-container" class="app-container hidden">
        <!-- Sol Panel: Kullanıcı Listesi -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile-info" id="open-profile">
                    <div id="my-avatar-container"></div>
                    <div class="user-details">
                        <span id="my-username" class="username">Yükleniyor...</span>
                        <span class="status-text">Çevrimiçi</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn-icon"><i class="fas fa-moon"></i></button>
                    <button id="logout-btn" class="btn-icon"><i class="fas fa-sign-out-alt"></i></button>
                    <button id="mobile-close-sidebar" class="btn-icon mobile-only"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="search-bar">
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="user-search" placeholder="Kullanıcı ara...">
                </div>
            </div>
            <div id="user-list" class="user-list">
                <!-- Kullanıcılar buraya dinamik olarak eklenecek -->
            </div>
        </aside>

        <!-- Sağ Panel: Sohbet Alanı -->
        <main class="chat-area">
            <header class="chat-header">
                <button id="mobile-menu-btn" class="btn-icon mobile-only"><i class="fas fa-bars"></i></button>
                <div id="active-user-info" class="active-user-info hidden">
                    <div id="chat-avatar-container"></div>
                    <div class="chat-user-details">
                        <h3 id="chat-username">Kullanıcı Seçin</h3>
                        <span id="chat-status" class="status-text">Offline</span>
                    </div>
                </div>
            </header>

            <div id="messages-container" class="messages-container">
                <div class="welcome-screen">
                    <i class="fas fa-comments"></i>
                    <h2>ChatPlus'a Hoş Geldiniz</h2>
                    <p>Mesajlaşmaya başlamak için soldan bir kullanıcı seçin.</p>
                </div>
            </div>

            <div id="typing-indicator" class="typing-indicator hidden">
                <span id="typing-text">birisi yazıyor...</span>
                <div class="dots"><span></span><span></span><span></span></div>
            </div>

            <footer class="chat-footer hidden" id="chat-footer">
                <form id="message-form">
                    <input type="text" id="message-input" placeholder="Mesajınızı yazın..." autocomplete="off">
                    <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Profil Modalı -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Profil Ayarları</h3>
                <button id="close-profile" class="btn-icon"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="profile-avatar-container" id="profile-preview-container">
                    <!-- Avatar buraya gelecek -->
                </div>
                <div class="input-group">
                    <label>Biyografi</label>
                    <textarea id="profile-bio" placeholder="Kendinizden bahsedin..."></textarea>
                </div>
                <button id="save-profile" class="btn-primary">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="importmap">
        {
          "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
          }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
